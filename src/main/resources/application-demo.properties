# =================================
# DATABASE - DEMO / POSTGRESQL
# =================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =================================
# KEYCLOAK - ONLINE
# =================================

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}

keycloak.logout-url=${KEYCLOAK_LOGOUT_URL}

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL}

# =================================
# KEYCLOAK CLIENT - DEMO
# =================================

spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# =================================
# KEYCLOAK ADMIN CLIENT - DEMO
# =================================

keycloak.admin.client-id=moto-team-admin
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# =================================
# SUPABASE - DEMO
# =================================

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:daFigma}
supabase.public-url=${SUPABASE_PUBLIC_URL}

# =================================
# STRIPE TEST - DEMO
# =================================

stripe.public-key=${STRIPE_PUBLIC_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

