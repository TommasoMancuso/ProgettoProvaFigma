spring.application.name=da_figma

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =================================
# KEYCLOAK
# =================================

spring.security.oauth2.client.registration.keycloak.client-id=moto-team-app

spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

####################################################
# KEYCLOAK ADMIN CLIENT
####################################################

keycloak.admin.realm=dafigma

# =================================
# KEYCLOAK ADMIN CLIENT - LOCAL
# =================================

keycloak.admin.client-id=moto-team-admin

spring.security.oauth2.client.registration.keycloak-admin.client-id=${keycloak.admin.client-id}

spring.security.oauth2.client.registration.keycloak-admin.client-secret=${keycloak.admin.client-secret}

spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials

spring.security.oauth2.client.registration.keycloak-admin.scope=openid

spring.security.oauth2.client.provider.keycloak-admin.token-uri=${keycloak.admin.server-url}/realms/${keycloak.admin.realm}/protocol/openid-connect/token

