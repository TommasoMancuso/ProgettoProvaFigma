<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- HERO -->
    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>AMMINISTRA IL  <span>TUO STAFF</span></h1>
            <p>La pagina progettata appositamente per permetterti di gestire al meglio il tuo team.</p>
        </div>
    </section>

    <!-- MEMBRI DEL TEAM -->
    <section class="rtp-section" id="membri staff">
        <!-- TABELLA -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <table class="table table-striped table-responsive-lg">
                        <thead>
                            <tr>
                                <th class="bg-dark text-white">Nome</th> 
                                <th class="bg-dark text-white">Ruolo</th>
                                <th class="bg-dark text-white">Data di nascita</th>
                                <th class="bg-dark text-white">Cellulare</th>
                                <th class="bg-dark text-white">#Actions</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}" class="align-middle">
                                <td th:text="${user.name + ' ' + user.surname}"></td>
                                <td th:text="${user.teamRole.name}"></td>
                                <td th:text="${user.birthDate}"></td>
                                <td th:text="${user.phone}"></td>
                                <td class="text-end">
                                    <a th:href="@{/admin/staff/detail/{id}(id=${user.id})}" class="btn btn-custom p-2">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                    <a th:href="@{/admin/staff/edit/{id}(id=${user.id})}" class="btn btn-warning p-2">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <a th:href="@{/admin/staff/delete/{id}(id=${user.id})}" class="btn btn-danger p-2" onclick="return confirm('Sei sicuro di voler eliminare questo membro?')">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <div class="p-2">
                            <a th:href="@{/newStaff}" class="btn-primary text-decoration-none">Aggiungi staff</a>
                        </div>
                    </table>
                </div>
            </div>
        </div>   
    </section>
    

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
</body>
</html>
