<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>CREA IL TUO <span>STAFF</span></h1>
            <p>La pagina dove creare uno ad uno i preziosi membri del tuo team!</p>
        </div>
    </section>

    <!-- FORM DI CREAZIONE STAFF -->
     <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9">
                <form th:object="${teamUser}" class="row g-3 p-4" method="post" th:action="@{/createStaff}" enctype="multipart/form-data">
                    <div class="col-md-4">
                        <label for="validationDefault01" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="validationDefault01" th:field="*{name}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="validationDefault02" class="form-label">Cognome</label>
                        <input type="text" class="form-control" id="validationDefault02" th:field="*{surname}">
                    </div>
                    <div class="col-md-4">
                        <label for="validationDefaultUsername" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text" id="inputGroupPrepend2">@</span>
                            <input type="email" class="form-control" id="email" aria-describedby="inputGroupPrepend2" th:field="*{email}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="validationDefault03" class="form-label">Cellulare</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Data di nascita</label>
                        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">
                    </div>
                    <div class="col-md-6">
                        <label for="validationDefault03" class="form-label">Profilo Instagram</label>
                        <input type="url" class="form-control" id="url" th:field="*{instagram}">
                    </div>
                    <div class="col-md-6">
                        <label for="teamRole" class="form-label">Ruolo nel Team</label>
                        <select class="form-select role-select" id="teamRole" name="roleId" required>
                            <option value="" selected disabled>Seleziona un ruolo</option>
                            <option th:each="role : ${roles}" th:value="${role.id}"
                                    th:text="${role.name}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="floatingTextarea2">Descrizione</label>
                        <textarea class="form-control" id="floatingTextarea2" style="height: 100px" th:field="*{bio}"></textarea>
                    </div>
                    <div>
                        <label for="formFile" class="form-label">Inserisci immagine</label>
                        <input class="form-control" type="file" id="formFile" name="imageFile" accept="image/*">
                    </div>
                    <div class="col-12 d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-primary">Crea membro staff</button>
                        <button type="button" class="btn btn-secondary" onclick="history.back()">
                                <i class="fa-solid fa-arrow-left"></i>Torna indietro
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>



    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
    
</body>
</html>
