<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments/head :: head}"></head>

<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

       <section class="rtp-hero">
            <div class="rtp-hero-overlay">                
            </div>        
            <div class="rtp-container">
                <h1>MODIFICA MEMBRO <span>STAFF</span></h1>
                <p>Qui puoi modificare i dati dei membri del tuo staff.</p>
            </div>
        </section>

        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9">
                    <form th:action="@{/admin/staff/update/{id}(id=${user.id})}" class="row g-3 p-4" method="post" enctype="multipart/form-data" th:object="${user}">
                        <div class="col-md-4">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" th:field="*{name}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Cognome</label>
                            <input type="text" class="form-control" th:field="*{surname}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefono</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data di nascita</label>
                            <input type="date" class="form-control" th:field="*{birthDate}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ruolo nel team</label>
                            <select class="form-select" th:field="*{teamRole.id}">
                                <option value="" disabled>Seleziona ruolo</option>
                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${role.name}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Instagram</label>
                            <input type="text" class="form-control" th:field="*{instagram}">
                        </div>
                        <div>
                            <label class="form-label" for="floatingTextarea2">Descrizione</label>
                            <textarea class="form-control" id="floatingTextarea2" style="height: 100px" th:field="*{bio}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Immagine attuale</label><br>
                            <img th:if="${user.profileImage != null}" th:src="${user.profileImage}"
                                class="img-thumbnail" style="max-width: 200px;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cambia immagine (opzionale)</label>
                            <input type="file" name="image" class="form-control">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salva modifiche</button>
                            <a th:href="@{/admin/staff/staff}" class="btn btn-secondary">Annulla</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

</body>
</html>
