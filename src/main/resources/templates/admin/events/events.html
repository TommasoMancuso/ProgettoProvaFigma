<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>GESTISCI I TUOI <span>EVENTI</span></h1>
            <p>Da qui potrai visualizzare, creare, modificare ed eliminare i tuoi eventi.</p>
        </div>
    </section>

        <!-- MOTO DEL TEAM -->
    <section class="rtp-section" id="membri staff">
        <!-- TABELLA -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <table class="table table-striped table-responsive-lg">
                        <thead>
                            <tr>
                                <th class="bg-dark text-white">Nome evento</th>
                                <th class="bg-dark text-white">Circuito</th>
                                <th class="bg-dark text-white">Inizio</th>
                                <th class="bg-dark text-white">Fine</th>
                                <th class="bg-dark text-white">Disponibilità</th>
                                <th class="bg-dark text-white">#Actions</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="event : ${events}" class="align-middle">
                                <td th:text="${event.name}"></td>
                                <td th:text="${event.circuit.name}"></td>
                                <td th:text="${event.startDate}"></td>
                                <td th:text="${event.endDate}"></td>
                                <td th:text="${event.status}"></td>
                                <td class="text-end">
                                    <a th:href="@{/admin/events/detail/{id}(id=${event.id})}" class="btn btn-custom p-2">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                    <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" class="btn btn-warning p-2">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <a th:href="@{/admin/events/delete/{id}(id=${event.id})}" class="btn btn-danger p-2">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <div class="p-2">
                            <a th:href="@{/admin/events/newEvent}" class="btn-primary text-decoration-none">Aggiungi evento</a>
                        </div>
                    </table>
                </div>
            </div>
        </div>        
    </section>



    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
    
</body>
</html>
