<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- HERO -->
    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>AMMINISTRA I <span>SERVIZI</span></h1>
            <p>Gestisci i servizi offerti dal tuo team e controlla lo stato di attivazione.</p>
        </div>
    </section>

    <!-- SERVIZI -->
    <section class="rtp-section" id="servizi">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <table class="table table-striped table-responsive-lg">
                        <thead>
                            <tr>
                                <th class="bg-dark text-white">Nome</th> 
                                <th class="bg-dark text-white">Tipologia Prezzo</th>
                                <th class="bg-dark text-white">Prezzo Base</th>
                                <th class="bg-dark text-white">Stato</th>
                                <th class="bg-dark text-white">#Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="service : ${services}" class="align-middle">

                                <!-- NOME -->
                                <td th:text="${service.name}"></td>
                                <td th:text="${service.pricingType}"></td>
                                <td th:text="${service.basePrice != null ? service.basePrice + ' €' : '-'}"></td>
                                <td th:text="${service.active ? 'ATTIVO' : 'NON ATTIVO'}"></td>

                                <!-- ACTIONS -->
                                <td class="text-end">
                                    <a th:href="@{/admin/services/detail/{id}(id=${service.id})}" 
                                       class="btn btn-custom p-2">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                    <a th:href="@{/admin/services/edit/{id}(id=${service.id})}" 
                                       class="btn btn-warning p-2">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <a th:href="@{/admin/services/delete/{id}(id=${service.id})}" 
                                       class="btn btn-danger p-2"
                                       onclick="return confirm('Sei sicuro di voler disattivare questo servizio?')">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <div class="p-2">
                            <a th:href="@{/admin/services/new}" class="btn-primary text-decoration-none">
                                Aggiungi servizio
                            </a>
                        </div>
                    </table>
                </div>
            </div>
        </div>   

    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>
    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>

</body>
</html>
