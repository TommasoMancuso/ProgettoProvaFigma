<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>AGGIUNGI I <span>CIRCUITI</span></h1>
            <p>Aggiungi i circuiti dove fai sfrecciare le tue moto!</p>
        </div>
    </section>

    <!-- FORM DI CREAZIONE MOTO -->
     <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9">
                <form th:object="${circuit}" class="row g-3 p-4" method="post" th:action="@{/admin/circuits/createCircuit}" enctype="multipart/form-data">
                    <div class="col-md-6">
                        <label for="validationDefault01" class="form-label">Nome circuito</label>
                        <input type="text" class="form-control" id="validationDefault01" th:field="*{name}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="validationDefault02" class="form-label">Paese</label>
                        <input type="text" class="form-control" id="validationDefault02" th:field="*{country}">
                    </div>
                    <div class="col-md-6">
                        <label for="validationDefaultUsername" class="form-label">Lunghezza</label>
                        <div class="input-group">
                            <input type="number" class="form-control" aria-describedby="inputGroupPrepend2" th:field="*{lengthMeters}" required>
                        </div>
                    </div>   
                    <div class="col-md-6">
                        <label for="formFile" class="form-label">Inserisci immagine</label>
                        <input class="form-control" type="file" id="formFile" name="imageFile" accept="image/*">
                    </div>   
                    <div>
                        <label class="form-label" for="floatingTextarea2">Descrizione</label>
                        <textarea class="form-control" id="floatingTextarea2" style="height: 100px" th:field="*{description}"></textarea>
                    </div>                
                    <div class="col-12 d-flex justify-content-center mt-4">
                        <button type="submit" class="btn-primary me-3">Aggiungi circuito</button>
                        <button type="button" class="btn btn-secondary" onclick="history.back()">
                            <i class="fa-solid fa-arrow-left"></i>Torna indietro
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>




    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
</body>
</html>
