<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- HERO -->
    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>        
        <div class="rtp-container">
            <h1>DASHBOARD DELL' <span>AMMINISTRATORE</span></h1>
            <p>La pagina progettata appositamente per permetterti di gestire al meglio il tuo team.</p>
        </div>
    </section>

    <!-- MEMBRI DEL TEAM -->
    <section class="rtp-section" id="membri staff">
        <div class="rtp-container">
            <h2 class="text-center p-5">Il tuo staff</h2>
        </div>
        <!-- TABELLA -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <table class="table table-striped table-responsive-lg">
                        <thead>
                            <tr>
                                <th class="bg-dark text-white">Nome</th>
                                <th class="bg-dark text-white">Cognome</th>
                                <th class="bg-dark text-white">Ruolo</th>
                                <th class="bg-dark text-white">Data di nascita</th>
                                <th class="bg-dark text-white">Cellulare</th>
                                <th class="bg-dark text-white">#Actions</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requests}">
                                <td th:text="${request.id}"></td>
                                <td th:text="${request.user.username}"></td>
                                <td th:text="${request.role.name}"></td>
                                <td class="text-end">
                                    <a th:href="@{/operations/career/request/detail/{id}(id=${request.id})}" class="btn btn-primary p-2">
                                        <i class="fa-solid fa-bars"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <div class="p-2">
                            <a th:href="@{/newStaff}" class="btn-primary text-decoration-none">Aggiungi staff</a>
                        </div>
                    </table>
                </div>
            </div>
        </div>   
    </section>

    <!-- MOTO DEL TEAM -->
    <section class="rtp-section" id="membri staff">
        <div class="rtp-container">
            <h2 class="text-center p-5">Le tue moto</h2>
        </div>
        <!-- TABELLA -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <table class="table table-striped table-responsive-lg">
                        <thead>
                            <tr>
                                <th class="bg-dark text-white">Marca</th>
                                <th class="bg-dark text-white">Modello</th>
                                <th class="bg-dark text-white">Anno</th>
                                <th class="bg-dark text-white">Categoria</th>
                                <th class="bg-dark text-white">Numero di telaio</th>
                                <th class="bg-dark text-white">#Actions</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requests}">
                                <td th:text="${request.id}"></td>
                                <td th:text="${request.user.username}"></td>
                                <td th:text="${request.role.name}"></td>
                                <td class="text-end">
                                    <a th:href="@{/operations/career/request/detail/{id}(id=${request.id})}" class="btn btn-primary p-2">
                                        <i class="fa-solid fa-bars"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <div class="p-2">
                            <a th:href="@{/categories/create}" class="btn-primary text-decoration-none">Aggiungi moto</a>
                        </div>
                    </table>
                </div>
            </div>
        </div>        
    </section>



    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
</body>
</html>
