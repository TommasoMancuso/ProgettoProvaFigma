<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- HERO -->
    <section class="rtp-hero">
        <div class="rtp-hero-overlay"></div>
        <div class="rtp-container">
            <h1 th:text="${bike.brand + ' ' + bike.model}"></h1>
        </div>
    </section>

    <!-- DETTAGLI STAFF -->
    <section class="container py-5">
        <div class="row align-items-center g-5">

            <!-- FOTO -->
            <div class="col-12 col-md-6 text-center">
                <img th:src="${bike.bikeImage}" alt="Foto moto" class="img-fluid section-image rounded shadow">
            </div>

            <!-- DATI -->
            <div class="col-12 col-md-6">
                <div class="card bg-dark text-white staffDetailCard border-danger">
                    <div class="card-body">
                        <h3 class="mb-4">Informazioni sulla moto</h3>
                        <p>
                            <strong>Anno:</strong>
                            <span th:text="${bike.year}"></span>
                        </p>
                        <p>
                            <strong>Categoria:</strong>
                            <span th:text="${bike.category}"></span>
                        </p>
                        <p>
                            <strong>Numero di telaio:</strong>
                            <span th:text="${bike.chassisNumber}"></span>
                        </p>
                        <p>
                            <strong>Chilometri:</strong>
                            <span th:text="${bike.currentKm}"></span>
                        </p>
                        <p>
                            <strong>Noleggio giornaliero:</strong>
                            <span th:text="${bike.dailyPrice} + ' €'"></span>
                        </p>                        
                    </div>
                </div>
            </div>
        </div>

        <!-- BIO -->
        <div class="row mt-5">
            <div class="col-12">
                <div class="card bg-dark text-white border-danger">
                    <div class="card-body">
                        <h3 class="mb-3">Descrizione</h3>
                        <p th:text="${bike.description}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- AZIONI -->
        <div class="text-center mt-5">           
            <a th:href="@{/admin/bikes/edit/{id}(id=${bike.id})}"
            class="btn btn-warning me-3">
                <i class="fa-solid fa-pen"></i>
                Modifica
            </a>
            <a th:href="@{/admin/bikes/delete/{id}(id=${bike.id})}" class="btn btn-danger me-3" onclick="return confirm('Sei sicuro di voler eliminare questa moto?')">
                <i class="fa-solid fa-trash"></i>
                Elimina
            </a>
            <button type="button" class="btn btn-secondary" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
                Torna indietro
            </button>
        </div>
    </section>



    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
    
</body>
</html>
