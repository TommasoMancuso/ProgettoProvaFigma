<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    
    
    
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <h1 class="text-center titles">ACCEDI</h1>
            </div>
            <div class="col-12 col-md-9">
                <form class="row g-3 p-4" method="post" th:action="@{/loginUser}" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-6">
                        <label for="validationDefaultUsername" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text" id="inputGroupPrepend2">@</span>
                            <input type="email" class="form-control" id="email" aria-describedby="inputGroupPrepend2" name="email" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="validationDefault03" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-12 col-md-6 p-2">
                        <a class="d-flex justify-content-center  text-decoration-none" th:href="@{/loginUser}">
                            <button class="btn-primary" type="submit">ACCEDI</button>
                        </a>
                    </div>
                    <div class="col-12 col-md-6 pt-3 p-2">
                        <p class="d-flex justify-content-center">
                            Non sei ancora registrato? 
                            <a class="text-white px-2" th:href="@{/register}"> REGISTRATI</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    
    
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script th:replace="~{fragments/bootstrap :: bootstrap}"></script>
    
    <script th:replace="~{fragments/scriptjs :: scriptjs}"></script>
    
</body>
</html>
