<!DOCTYPE html>
<html lang="it">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<section class="rtp-hero-booking">
    <div class="rtp-hero-overlay"></div>
    <div class="rtp-container">
        <h1>PRENOTA IL TUO <span class="spanBooking">EVENTO</span></h1>
        <p>Seleziona servizi, moto e date.</p>
    </div>
</section>

<div class="container py-5">

    <form id="bookingForm"
        th:object="${bookingRequest}"
        th:action="@{/booking/review}"
        method="post"
        class="py-4">

        <input type="hidden"
                name="eventId"
                th:value="${bookingForm.eventId}">



        <div class="row g-5">

            <!-- ================================================= -->
            <!-- SINISTRA -->
            <!-- ================================================= -->

            <div class="col-lg-8">

                <!-- ================================================= -->
                <!-- DATI EVENTO -->
                <!-- ================================================= -->

                <div class="card bg-dark text-white border-danger mb-4">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Informazioni evento
                        </h3>

                        <div class="row">

                            <div class="col-md-4">

                                <label class="form-label">
                                    Evento
                                </label>

                                <input type="text"
                                    class="form-control"
                                    th:value="${bookingForm.eventName}"
                                    readonly>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Organizzatore
                                </label>

                                <input type="text"
                                    class="form-control"
                                    th:value="${bookingForm.organizer}"
                                    readonly>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Circuito
                                </label>

                                <input type="text"
                                    class="form-control"
                                    th:value="${bookingForm.circuitName}"
                                    readonly>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================================================= -->
                <!-- SERVIZI -->
                <!-- ================================================= -->

                <div class="card bg-dark text-white border-danger">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Servizi disponibili
                        </h3>


                        <div th:each="service, stat : ${bookingForm.services}"
                            class="mb-4 service-container"
                            th:attr="data-index=${stat.index}">

                            <!-- ================================================= -->
                            <!-- CHECK SERVIZIO -->
                            <!-- ================================================= -->

                            <div class="form-check">

                                <input class="form-check-input service-checkbox"
                                    type="checkbox"

                                    th:id="'service-' + ${service.serviceId}"

                                    th:value="${service.serviceId}"

                                    th:attr="
                                        data-service-id=${service.serviceId},
                                        data-name=${service.serviceName},
                                        data-pricing=${service.pricingType},
                                        data-price1=${service.priceOneDay},
                                        data-price2=${service.priceTwoDays},
                                        data-price3=${service.priceThreeDays},
                                        data-pricefull=${service.priceFullEvent}">

                                <label class="form-check-label fw-bold"
                                    th:for="'service-' + ${service.serviceId}">

                                    <span th:text="${service.serviceName}">
                                    </span>

                                </label>

                            </div>


                            <!-- ================================================= -->
                            <!-- DETTAGLI SERVIZIO -->
                            <!-- ================================================= -->

                            <div class="service-details ms-4 mt-3 d-none">


                                <!-- ================================================= -->
                                <!-- MOTO -->
                                <!-- ================================================= -->

                                <div th:if="${service.pricingType != null and service.pricingType.name() == 'BIKE_BASED'}">

                                    <div th:if="${#lists.isEmpty(service.availableBikes)}">

                                        <p class="text-danger">
                                            Non ci sono moto disponibili per questo evento.
                                        </p>

                                    </div>


                                    <div th:unless="${#lists.isEmpty(service.availableBikes)}">

                                        <label class="form-label">
                                            Seleziona moto
                                        </label>

                                        <select class="form-control bike-select">

                                            <option value="">
                                                Seleziona moto
                                            </option>

                                            <option th:each="bike : ${service.availableBikes}"

                                                    th:value="${bike.id}"

                                                    th:attr="
                                                        data-price=${bike.dailyPrice}"

                                                    th:text="${bike.name + ' - €' + bike.dailyPrice}">

                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- ================================================= -->
                                <!-- DATE -->
                                <!-- ================================================= -->

                                <div class="mt-3">

                                    <label class="form-label">
                                        Date
                                    </label>

                                    <div class="row">

                                        <div class="col-md-4 mb-2"
                                            th:each="date : ${bookingForm.eventDates}">

                                            <div class="form-check">

                                                <input type="checkbox"
                                                    class="form-check-input date-checkbox"
                                                    th:value="${date}">

                                                <label class="form-check-label"
                                                    th:text="${date}">
                                                </label>

                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- DESTRA - RIEPILOGO -->
            <!-- ================================================= -->

            <div class="col-lg-4">

                <div class="card bg-dark text-white border-danger position-sticky"
                    style="top: 30px;">

                    <div class="card-body">

                        <h3>
                            Riepilogo
                        </h3>

                        <hr>

                        <div id="bookingSummary">
                            Nessun servizio selezionato
                        </div>

                        <hr>

                        <h4>
                            Totale:
                            <span id="totalPrice">
                                € 0.00
                            </span>
                        </h4>

                    </div>

                </div>


                <div class="text-center mt-4">

                    <button type="submit"
                            class="btn-primary text-decoration-none px-5">

                        Vai al riepilogo

                    </button>

                </div>

            </div>

        </div>

    </form>


</div>


<script th:replace="~{fragments/bootstrap :: bootstrap}"></script>


<script>

    document.addEventListener('DOMContentLoaded', function () {

        // =========================================================
        // ELEMENTI PRINCIPALI
        // =========================================================

        const bookingForm =
            document.getElementById('bookingForm');

        const summary =
            document.getElementById('bookingSummary');

        const totalElement =
            document.getElementById('totalPrice');


        // =========================================================
        // CALCOLO PREZZO
        // =========================================================

        function updateSummary() {

            let total = 0;

            let html = '';


            document
                .querySelectorAll('.service-checkbox:checked')
                .forEach(function (serviceCheckbox) {

                    const container =
                        serviceCheckbox.closest('.service-container');


                    if (!container) {
                        return;
                    }


                    const serviceName =
                        serviceCheckbox.dataset.name || 'Servizio';


                    const pricingType =
                        serviceCheckbox.dataset.pricing || '';


                    const selectedDates =
                        container.querySelectorAll(
                            '.date-checkbox:checked'
                        ).length;


                    const totalEventDates =
                        container.querySelectorAll(
                            '.date-checkbox'
                        ).length;


                    let price = 0;


                    // =================================================
                    // FIXED
                    // =================================================

                    if (pricingType === 'FIXED') {

                        price = parseFloat(
                            serviceCheckbox.dataset.pricefull || '0'
                        );

                    }


                    // =================================================
                    // EVENT BASED
                    // =================================================

                    else if (pricingType === 'EVENT_BASED') {

                        if (selectedDates === 0) {

                            price = 0;

                        }

                        else if (
                            totalEventDates > 0 &&
                            selectedDates === totalEventDates
                        ) {

                            price = parseFloat(
                                serviceCheckbox.dataset.pricefull || '0'
                            );

                        }

                        else if (selectedDates === 1) {

                            price = parseFloat(
                                serviceCheckbox.dataset.price1 || '0'
                            );

                        }

                        else if (selectedDates === 2) {

                            price = parseFloat(
                                serviceCheckbox.dataset.price2 || '0'
                            );

                        }

                        else if (selectedDates === 3) {

                            price = parseFloat(
                                serviceCheckbox.dataset.price3 || '0'
                            );

                        }

                        else {

                            price = 0;

                        }

                    }


                    // =================================================
                    // BIKE BASED
                    // =================================================

                    else if (pricingType === 'BIKE_BASED') {

                        const bikeSelect =
                            container.querySelector('.bike-select');


                        if (
                            bikeSelect &&
                            bikeSelect.value &&
                            selectedDates > 0
                        ) {

                            const selectedOption =
                                bikeSelect.selectedOptions[0];


                            const bikePrice =
                                parseFloat(
                                    selectedOption.dataset.price || '0'
                                );


                            price =
                                bikePrice * selectedDates;

                        }

                    }


                    // =================================================
                    // SICUREZZA PREZZO
                    // =================================================

                    if (isNaN(price)) {
                        price = 0;
                    }


                    total += price;


                    // =================================================
                    // RIEPILOGO SERVIZIO
                    // =================================================

                    html += `
                        <div class="mb-2">

                            <strong>
                                ${serviceName}
                            </strong>

                            <br>

                            € ${price.toFixed(2)}

                        </div>
                    `;

                });


            // =========================================================
            // NESSUN SERVIZIO
            // =========================================================

            if (html === '') {

                html =
                    'Nessun servizio selezionato';

            }


            // =========================================================
            // AGGIORNAMENTO DOM
            // =========================================================

            summary.innerHTML = html;

            totalElement.innerText =
                '€ ' + total.toFixed(2);

        }


        // =========================================================
        // CHECKBOX SERVIZI
        // =========================================================

        document
            .querySelectorAll('.service-checkbox')
            .forEach(function (checkbox) {

                checkbox.addEventListener(
                    'change',
                    function () {

                        const container =
                            this.closest('.service-container');


                        if (!container) {
                            return;
                        }


                        const details =
                            container.querySelector(
                                '.service-details'
                            );


                        if (details) {

                            details.classList.toggle(
                                'd-none',
                                !this.checked
                            );

                        }


                        updateSummary();

                    }
                );

            });


        // =========================================================
        // CHECKBOX DATE
        // =========================================================

        document
            .querySelectorAll('.date-checkbox')
            .forEach(function (checkbox) {

                checkbox.addEventListener(
                    'change',
                    updateSummary
                );

            });


        // =========================================================
        // SELECT MOTO
        // =========================================================

        document
            .querySelectorAll('.bike-select')
            .forEach(function (select) {

                select.addEventListener(
                    'change',
                    updateSummary
                );

            });


        // =========================================================
        // CREAZIONE INPUT HIDDEN
        // =========================================================

        function createHiddenInput(name, value) {

            const input =
                document.createElement('input');

            input.type = 'hidden';

            input.name = name;

            input.value = value;

            return input;

        }


        // =========================================================
        // INVIO FORM
        // =========================================================

        bookingForm.addEventListener(
            'submit',
            function (e) {

                // -----------------------------------------------------
                // Rimuove eventuali input hidden creati precedentemente
                // -----------------------------------------------------

                bookingForm
                    .querySelectorAll(
                        '.generated-booking-input'
                    )
                    .forEach(function (input) {

                        input.remove();

                    });


                const selectedServices =
                    document.querySelectorAll(
                        '.service-checkbox:checked'
                    );


                // =====================================================
                // CONTROLLO
                // =====================================================

                if (selectedServices.length === 0) {

                    e.preventDefault();

                    alert(
                        'Seleziona almeno un servizio.'
                    );

                    return;

                }


                // =====================================================
                // SERVIZI
                // =====================================================

                selectedServices.forEach(
                    function (serviceCheckbox, index) {

                        const container =
                            serviceCheckbox.closest(
                                '.service-container'
                            );


                        if (!container) {
                            return;
                        }


                        // =================================================
                        // SERVICE ID
                        // =================================================

                        const serviceIdInput =
                            createHiddenInput(
                                'services['
                                + index
                                + '].serviceId',

                                serviceCheckbox.value
                            );


                        serviceIdInput.classList.add(
                            'generated-booking-input'
                        );


                        bookingForm.appendChild(
                            serviceIdInput
                        );


                        // =================================================
                        // BIKE ID
                        // =================================================

                        const bikeSelect =
                            container.querySelector(
                                '.bike-select'
                            );


                        let bikeId = '';


                        if (
                            bikeSelect &&
                            bikeSelect.value
                        ) {

                            bikeId =
                                bikeSelect.value;

                        }


                        const bikeIdInput =
                            createHiddenInput(
                                'services['
                                + index
                                + '].bikeId',

                                bikeId
                            );


                        bikeIdInput.classList.add(
                            'generated-booking-input'
                        );


                        bookingForm.appendChild(
                            bikeIdInput
                        );


                        // =================================================
                        // DATE
                        // =================================================

                        const selectedDates =
                            container.querySelectorAll(
                                '.date-checkbox:checked'
                            );


                        selectedDates.forEach(
                            function (dateCheckbox, dateIndex) {

                                const dateInput =
                                    createHiddenInput(
                                        'services['
                                        + index
                                        + '].selectedDates['
                                        + dateIndex
                                        + ']',

                                        dateCheckbox.value
                                    );


                                dateInput.classList.add(
                                    'generated-booking-input'
                                );


                                bookingForm.appendChild(
                                    dateInput
                                );

                            }
                        );

                    }
                );


                // =====================================================
                // IL FORM VIENE INVIATO NORMALMENTE
                // =====================================================
                //
                // NON facciamo preventDefault().
                //
                // Il browser eseguirà:
                //
                // POST /booking/review
                //
                // con application/x-www-form-urlencoded
                //
                // e Spring utilizzerà @ModelAttribute.
                //
                // =====================================================

            }
        );


        // =========================================================
        // CALCOLO INIZIALE
        // =========================================================

        updateSummary();

    });

</script>


</body>
</html>
