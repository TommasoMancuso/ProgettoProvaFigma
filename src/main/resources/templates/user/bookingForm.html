<!DOCTYPE html>
<html lang="it">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<section class="rtp-hero">
    <div class="rtp-hero-overlay"></div>
    <div class="rtp-container">
        <h1>PRENOTA IL TUO <span>EVENTO</span></h1>
        <p>Seleziona servizi, moto e date.</p>
    </div>
</section>

<div class="container py-5">
    <form id="bookingForm" th:object="${bookingRequest}" class="py-4">
        <input type="hidden" th:value="${bookingForm.eventId}" name="eventId">
        <div class="row g-5">

            <!-- SINISTRA -->
            <div class="col-lg-8">

                <!-- DATI EVENTO -->
                <div class="card bg-dark text-white border-danger mb-4">
                    <div class="card-body">
                        <h3 class="mb-4">Informazioni evento</h3>
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Evento</label>
                                <input type="text" class="form-control"
                                       th:value="${bookingForm.eventName}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Organizzatore</label>
                                <input type="text" class="form-control"
                                       th:value="${bookingForm.organizer}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Circuito</label>
                                <input type="text" class="form-control"
                                       th:value="${bookingForm.circuitName}" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SERVIZI -->
                <div class="card bg-dark text-white border-danger">
                    <div class="card-body">
                        <h3 class="mb-4">Servizi disponibili</h3>
                        <div th:each="service : ${bookingForm.services}" class="mb-4">

                            <!-- CHECK SERVIZIO -->
                            <div class="form-check">
                                <input class="form-check-input service-checkbox" type="checkbox"
                                        th:value="${service.serviceId}"
                                                th:attr="
                                                    data-name=${service.serviceName},
                                                    data-pricing=${service.pricingType},
                                                    data-price1=${service.priceOneDay},
                                                    data-price2=${service.priceTwoDays},
                                                    data-price3=${service.priceThreeDays},
                                                    data-pricefull=${service.priceFullEvent}">
                                <label class="form-check-label fw-bold">
                                    <span th:text="${service.serviceName}"></span>
                                </label>
                            </div>

                            <!-- DETTAGLI SERVIZIO -->
                            <div class="service-details ms-4 mt-3 d-none">

                                <!-- SELECT MOTO -->
                                <div th:if="${service.pricingType.name() == 'BIKE_BASED'}">
                                    <div th:if="${#lists.isEmpty(service.availableBikes)}">
                                        <p class="text-danger">
                                            Non ci sono moto disponibili per questo evento.
                                        </p>
                                    </div>
                                    <div th:unless="${#lists.isEmpty(service.availableBikes)}">
                                        <label class="form-label">Seleziona moto</label>
                                        <select class="form-control bike-select">
                                            <option value="">Seleziona moto</option>
                                            <option th:each="bike : ${service.availableBikes}"
                                                    th:value="${bike.id}"
                                                    th:attr="data-price=${bike.dailyPrice}"
                                                    th:text="${bike.name + ' - €' + bike.dailyPrice}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <!-- DATE -->
                                <div class="mt-3">
                                    <label class="form-label">Date</label>
                                    <div class="row">
                                        <div class="col-md-4 mb-2" 
                                                th:each="date : ${bookingForm.eventDates}">
                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input date-checkbox" th:value="${date}">
                                                <label class="form-check-label" th:text="${date}">
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DESTRA -->
            <div class="col-lg-4">
                <div class="card bg-dark text-white border-danger position-sticky" style="top: 30px;">
                    <div class="card-body">
                        <h3>Riepilogo</h3>
                        <hr>
                        <div id="bookingSummary">
                            Nessun servizio selezionato
                        </div>
                        <hr>
                        <h4>Totale: <span id="totalPrice">€ 0.00</span>
                        </h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-5">
            <button type="submit" class="btn-primary px-5">Vai al riepilogo</button>
        </div>
    </form>
</div>

<script th:replace="~{fragments/bootstrap :: bootstrap}"></script>

<script>

function updateSummary() {

    const summary =
        document.getElementById('bookingSummary');

    const totalElement =
        document.getElementById('totalPrice');

    let total = 0;

    let html = '';

    document
        .querySelectorAll('.service-checkbox:checked')
        .forEach(serviceCheckbox => {

            const container =
                serviceCheckbox.closest('.mb-4');

            const serviceName =
                serviceCheckbox.dataset.name;

            const pricingType =
                serviceCheckbox.dataset.pricing;

            const selectedDates =
                container.querySelectorAll(
                    '.date-checkbox:checked'
                ).length;

            const totalEventDates =
                container.querySelectorAll('.date-checkbox').length;

            let price = 0;

            if (pricingType === 'FIXED') {

                price =
                    parseFloat(
                        serviceCheckbox.dataset.pricefull || 0
                    );

            } else if (pricingType === 'EVENT_BASED') {

                const totalEventDates =
                    container.querySelectorAll('.date-checkbox').length;

                if (selectedDates === 0) {

                    price = 0;

                } else if (selectedDates === totalEventDates) {

                    price =
                        parseFloat(
                            serviceCheckbox.dataset.pricefull || 0
                        );

                } else if (selectedDates === 1) {

                    price =
                        parseFloat(
                            serviceCheckbox.dataset.price1 || 0
                        );

                } else if (selectedDates === 2) {

                    price =
                        parseFloat(
                            serviceCheckbox.dataset.price2 || 0
                        );

                } else if (selectedDates === 3) {

                    price =
                        parseFloat(
                            serviceCheckbox.dataset.price3 || 0
                        );

                } else {

                    price = 0;
                }

            } else if (pricingType === 'BIKE_BASED') {

                const bikeSelect =
                    container.querySelector('.bike-select');

                if (bikeSelect &&
                    bikeSelect.selectedOptions.length > 0) {

                    const bikePrice =
                        parseFloat(
                            bikeSelect.selectedOptions[0]
                                .dataset.price || 0
                        );

                    price =
                        bikePrice * selectedDates;
                }
            }

            total += price;

            html += `
                <div class="mb-2">
                    <strong>${serviceName}</strong><br>
                    € ${price.toFixed(2)}
                </div>
            `;
        });

    if (html === '') {

        html = 'Nessun servizio selezionato';
    }

    summary.innerHTML = html;

    totalElement.innerText =
        '€ ' + total.toFixed(2);
}

document
    .querySelectorAll('.service-checkbox')
    .forEach(cb => {

        cb.addEventListener('change', function() {

            const details =
                this.closest('.mb-4')
                    .querySelector('.service-details');

            details.classList.toggle(
                'd-none',
                !this.checked
            );

            updateSummary();
        });
    });

document
    .querySelectorAll('.date-checkbox')
    .forEach(cb => {

        cb.addEventListener(
            'change',
            updateSummary
        );
    });

document
    .querySelectorAll('.bike-select')
    .forEach(select => {

        select.addEventListener(
            'change',
            updateSummary
        );
    });

</script>

</body>
</html>
